<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concorde</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <!-- Non-Chromium browsers get a heads-up: tab audio is only verified on
           Chrome/Edge (see Plano.md). Hidden by default; app.js reveals it. -->
      <div id="browser-warning" class="banner" role="alert" hidden>
        <span class="banner__text">
          Testado no Chrome e no Edge. Em outros navegadores, o áudio da
          transmissão pode não funcionar.
        </span>
        <button id="browser-warning-close" class="banner__close" type="button"
                aria-label="Dispensar aviso">×</button>
      </div>

      <header class="header">
        <h1 class="brand">Concorde</h1>
        <div class="statusbar">
          <a class="admin-link" href="/admin.html">admin</a>
          <span id="conn-status" class="status status--off">desconectado</span>
        </div>
      </header>

      <section class="stage">
        <div id="video-window" class="video-window">
          <!-- The image is optional and not in the repository: app.js reveals it
               only once it has loaded (see README). -->
          <div id="video-placeholder" class="placeholder">
            <img id="placeholder-img" class="placeholder__img"
                 src="/placeholder.webp" alt="" hidden />
            <p>Nenhuma transmissão ainda.</p>
          </div>
          <video id="video" class="video" playsinline hidden></video>
          <!-- Live stream numbers (resolution, fps, bitrate, path); toggled from
               the stats button, filled by app.js. -->
          <div id="stats-overlay" class="stats-overlay" hidden></div>
          <div id="video-controls" class="video-controls" hidden>
            <div id="volume-control" class="volume">
              <button id="mute-btn" class="volume__icon" type="button"
                      aria-pressed="false" aria-label="Silenciar"
                      title="Silenciar (M)">🔊</button>
              <input id="volume" class="volume__slider" type="range"
                     min="0" max="100" value="100" aria-label="Volume" />
            </div>
            <div class="video-controls__buttons">
              <button id="stats-btn" class="icon-btn" type="button"
                      aria-pressed="false" aria-label="Estatísticas da transmissão"
                      title="Estatísticas da transmissão">
                <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"
                     aria-hidden="true">
                  <rect x="2" y="9" width="3" height="5" rx="1" />
                  <rect x="6.5" y="5.5" width="3" height="8.5" rx="1" />
                  <rect x="11" y="2" width="3" height="12" rx="1" />
                </svg>
              </button>
              <button id="fullscreen-btn" class="icon-btn" type="button"
                      aria-label="Tela cheia" title="Tela cheia (F)">⛶</button>
            </div>
          </div>
        </div>
        <!-- Broadcast control sits just under the player, aligned to its right. -->
        <div class="stage__actions">
          <button id="broadcast-btn" class="btn-primary" type="button">
            Transmitir
          </button>
        </div>
      </section>

      <aside class="panel">
        <!-- Shown while not in a room: the two entry forms, side by side. -->
        <div id="lobby" class="panel__view">
          <div class="lobby-forms">
            <form id="create-form" class="card">
              <h2 class="card__title">Criar sala (quem transmite)</h2>
              <input id="admin-user" class="field" type="text"
                     placeholder="Seu usuário" autocomplete="username" />
              <input id="admin-pass" class="field" type="password"
                     placeholder="Sua senha" autocomplete="current-password" />
              <input id="new-room-pass" class="field" type="text"
                     placeholder="Senha da sala (opcional)" />
              <button class="btn-primary" type="submit">Criar sala</button>
              <p id="create-error" class="form-error" role="alert" hidden></p>
            </form>

            <form id="join-form" class="card">
              <h2 class="card__title">Entrar em uma sala</h2>
              <input id="join-room-id" class="field" type="text"
                     placeholder="Código da sala" autocapitalize="characters" />
              <input id="join-room-pass" class="field" type="password"
                     placeholder="Senha da sala (se tiver)" />
              <button class="btn-secondary" type="submit">Entrar</button>
              <p id="join-error" class="form-error" role="alert" hidden></p>
            </form>
          </div>
        </div>

        <!-- Shown while in a room. -->
        <div id="room-view" class="panel__view" hidden>
          <div class="card">
            <h2 class="card__title">Sala</h2>
            <p class="room-code">
              <span id="room-code">------</span>
              <button id="copy-code" class="copy-btn" type="button"
                      title="Copiar link da sala">copiar link</button>
            </p>
            <p class="room-role">Você é <strong id="room-role">—</strong></p>
            <ul id="peer-list" class="peer-list"></ul>
            <button id="leave-btn" class="btn-secondary" type="button">
              Sair da sala
            </button>
          </div>
        </div>
      </aside>
    </main>

    <!-- View-independent, transient notices (capture/connection errors, etc.). -->
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
